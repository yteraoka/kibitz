name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.5.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Lint
        run: golangci-lint run

  # The Pub/Sub tests run against an in-process fake in the `test` job. This
  # job repeats them against the real emulator, which is the only thing that
  # implements message ordering faithfully.
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start the Pub/Sub emulator
        run: |
          docker run -d --name pubsub -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --project=kibitz-test --host-port=0.0.0.0:8085
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8085/v1/projects/kibitz-test/topics >/dev/null 2>&1; then
              echo "emulator is up"; exit 0
            fi
            sleep 2
          done
          echo "emulator did not start"; docker logs pubsub; exit 1
      - name: Start the Firestore emulator
        run: |
          docker run -d --name firestore -p 8086:8086 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators firestore start --project=kibitz-test --host-port=0.0.0.0:8086
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8086/ >/dev/null 2>&1; then
              echo "emulator is up"; exit 0
            fi
            sleep 2
          done
          echo "emulator did not start"; docker logs firestore; exit 1
      - name: Run the Pub/Sub tests against the emulator
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: go test -race -count=1 ./internal/queue/pubsub/...
      - name: Run the Firestore tests against the emulator
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8086
        run: go test -race -count=1 ./internal/store/firestore/...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        run: govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f deploy/docker/Dockerfile.server -t kibitz-server:ci .
      - name: Build worker image
        run: docker build -f deploy/docker/Dockerfile.worker -t kibitz-worker:ci .
